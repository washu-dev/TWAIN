name: Runner Service - Lint & Test

on:
  push:
    branches: [master]
    paths:
      # Everything the worker image contains (runner/Dockerfile COPYs the repo):
      # with the worker on ECS (#171) a pipeline fix in modules/ must redeploy it.
      - 'runner/**'
      - 'modules/**'
      - 'configs/**'
      - 'schemas/**'
      - 'twain_paths.py'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/ci-runner.yml'
  pull_request:
    branches: [master]
    paths:
      - 'runner/**'
      - 'modules/**'
      - 'configs/**'
      - 'schemas/**'
      - 'twain_paths.py'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/ci-runner.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: twain-runner-ecr
  ECS_CLUSTER: twain-cluster
  ECS_SERVICE: twain-runner
  ECS_TASK_DEFINITION: twain-runner

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # Unit tests use in-memory fakes (no Postgres, no pixi engine); psycopg2
        # is imported at module load, so the binary wheel is enough here.
        run: pip install psycopg2-binary pytest

      # Lint through pixi so CI gates on the SAME ruff pixi.lock pins. A bare
      # `pip install ruff` floated ahead of the lock, so a release that adds rules
      # failed here after `pixi run lint` passed locally -- which is the whole
      # reason the local task exists.
      #
      # The `lint` environment is ruff and nothing else: 18 packages, ~3s to
      # install, against 411 for the default scientific stack. Cached on pixi.lock.
      - name: Set up pixi (lint environment only)
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: lint
          cache: true
          # Install strictly from pixi.lock, and fail if the manifest and
          # lock disagree -- otherwise CI could resolve its own ruff and the
          # drift this change removes would come straight back.
          locked: true

      - name: Lint — ruff (pixi run lint)
        run: pixi run -e lint lint

      - name: Unit tests
        run: pytest runner/tests -v

  # ── Deploy to ECS: build runner/Dockerfile from the repo ROOT → ECR → the
  #    twain-runner service (linux-64, so the sim env ships GPAW → real DFT).
  #    The ECR repo is created on the fly if missing. Remaining one-time
  #    prerequisites (see runner/README.md §Deploy): the ECS service
  #    `twain-runner` on `twain-cluster`, the Secrets Manager entries referenced
  #    by runner/ecs-task-definition.json, and the AWS_ACCESS_KEY_ID /
  #    AWS_SECRET_ACCESS_KEY repo secrets.
  # tests/unit covers modules/ -- the pipeline the worker image runs (planning,
  # the state machine, the Slurm adapter, S3 staging, detached EXECUTE). No
  # workflow ran it before P2; it needs the real pixi env, not a bare pip one.
  pipeline-tests:
    name: Pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi (default environment)
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
          locked: true

      - name: tests/unit
        run: pixi run pytest tests/unit -q -p no:cacheprovider

  deploy:
    name: Deploy Runner → ECS
    runs-on: ubuntu-latest
    needs: [quality, pipeline-tests]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        # The runner image bakes the full scientific pixi stack (GPAW, torch, …)
        # and is large; reclaim runner disk so the build doesn't run out.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker image prune -af || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        # Same check-then-create as scripts/aws/provision.sh; makes the repo a
        # self-provisioned prerequisite instead of a manual one-time step. If
        # the CI user lacks ecr:CreateRepository, have an admin run
        # scripts/aws/provision.sh --apply once instead.
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" \
                 --image-scanning-configuration scanOnPush=true >/dev/null
          # Cap storage: each push uploads a multi-GB image (GPAW + sim stack)
          # that ECR bills per GB-month. Keep only the 5 newest; :latest always
          # points at the most recent so nothing in use ever expires.
          aws ecr put-lifecycle-policy --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Keep only the 5 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' \
            >/dev/null

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build context is the repo ROOT (the Dockerfile COPYs modules/, configs/,
          # schemas/, twain_paths.py, …); the Dockerfile lives under runner/.
          docker build -f runner/Dockerfile \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Check the twain-runner ECS service exists
        # The service is one-time infra that hasn't been provisioned yet (and
        # the task def still has -REPLACE secret placeholders until
        # scripts/aws/setup_secrets.sh --apply is run). Until then, push the
        # image but skip the service deploy instead of failing the workflow.
        id: svc
        run: |
          active=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" --query "length(services[?status=='ACTIVE'])" --output text 2>/dev/null || echo 0)
          if [ "$active" = "1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ECS service '$ECS_SERVICE' not found on '$ECS_CLUSTER' -- image pushed to ECR, service deploy skipped. One-time provisioning: scripts/aws/setup_secrets.sh --apply, then scripts/aws/provision.sh --apply (see runner/README.md)."
          fi

      # The SendGrid key is injected only once email is switched on: a task
      # definition naming a secret that doesn't exist yet fails every launch.
      - name: Add the SendGrid secret when email notifications are on
        if: steps.svc.outputs.exists == 'true' && vars.TWAIN_NOTIFY_BACKEND == 'sendgrid'
        run: |
          jq '.containerDefinitions[0].secrets += [{"name": "TWAIN_SENDGRID_API_KEY",
                "valueFrom": "TWAIN/sendgrid/API_KEY"}]' \
            runner/ecs-task-definition.json > runner/td.tmp && mv runner/td.tmp runner/ecs-task-definition.json

      - name: Render task definition with the new image
        if: steps.svc.outputs.exists == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: runner/ecs-task-definition.json
          container-name: twain-runner
          image: ${{ steps.build-image.outputs.image }}
          # twain.sh on RIS storage (owner-managed; scripts/ris/twain.sh.example)
          # -- set the repo variable TWAIN_ENV_FILE to its path. TWAIN_GIT_SHA lets
          # jobs check the RIS checkout contains the commit that submitted them.
          # Email: TWAIN_NOTIFY_BACKEND (log|sendgrid) + TWAIN_NOTIFY_FROM (a
          # SendGrid-verified sender); TWAIN_ENV_APPROVERS (comma-separated) may
          # approve changes to shared RIS environments. All repo variables.
          environment-variables: |
            TWAIN_ENV_FILE=${{ vars.TWAIN_ENV_FILE }}
            TWAIN_GIT_SHA=${{ github.sha }}
            TWAIN_NOTIFY_BACKEND=${{ vars.TWAIN_NOTIFY_BACKEND || 'log' }}
            TWAIN_NOTIFY_FROM=${{ vars.TWAIN_NOTIFY_FROM }}
            TWAIN_ENV_APPROVERS=${{ vars.TWAIN_ENV_APPROVERS || 'arifs@wustl.edu' }}

      - name: Deploy to ECS
        if: steps.svc.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
