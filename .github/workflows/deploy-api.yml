name: API Server - Build & Deploy

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
  pull_request:
    branches: [master]
    paths:
      - 'api/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: twain-ecr
  ECS_CLUSTER: twain-cluster
  ECS_SERVICE: twain-washu
  ECS_TASK_DEFINITION: twain-api
  PYTHON_VERSION: '3.12'

jobs:
  # ── Quality & Security Checks ──────────────────────────────────────────────
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: |
          pip install -r requirements.txt
          pip install pip-audit pytest-cov

      # See ci-runner.yml: lint through pixi so both workflows gate on the ruff
      # pixi.lock pins, rather than whatever `pip install ruff` resolves today.
      # The `lint` environment is ruff alone (18 packages, ~3s), and the task lints
      # runner/ AND api/ in one pass -- ruff resolves config per file, so each tree
      # still gets its own ruff.toml. Run from the repo root, not api/, because the
      # task's paths are repo-relative; extra args pass through to ruff, so the
      # inline GitHub annotations are preserved.
      - name: Set up pixi (lint environment only)
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: lint
          cache: true
          # Install strictly from pixi.lock, and fail if the manifest and
          # lock disagree -- otherwise CI could resolve its own ruff and the
          # drift this change removes would come straight back.
          locked: true

      - name: Lint — ruff (pixi run lint)
        run: pixi run -e lint lint --output-format=github

      - name: Vulnerability scan — pip-audit
        working-directory: api
        # PYSEC-2025-183 (CVE-2025-45768): disputed by PyJWT maintainers, has no
        # fixed version, and concerns weak key length when *issuing* tokens — we
        # only verify Entra RS256 tokens, so it does not apply. Ignore so the gate
        # stays meaningful. Revisit if a fixed version ever ships.
        run: pip-audit -r requirements.txt --format markdown --ignore-vuln PYSEC-2025-183

      - name: Unit tests
        working-directory: api
        run: |
          pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --import-mode=importlib

  # ── Deploy to ECS (only on push/dispatch to master, not on PRs) ───────────
  deploy:
    name: Deploy API → ECS
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Cap ECR storage (keep 5 newest images)
        # Every deploy pushes a new sha-tagged image and ECR bills per GB-month;
        # expire all but the 5 newest (:latest always points at the most recent).
        run: |
          aws ecr put-lifecycle-policy --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Keep only the 5 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' \
            >/dev/null

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg GIT_SHA=$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./api
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            > api/task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api/task-definition.json
          container-name: twain-api
          image: ${{ steps.build-image.outputs.image }}
          # This step starts from the LIVE task definition (downloaded above),
          # not api/ecs-task-definition.json, so new API config must be set here
          # to reach production. TWAIN_RUN_BUCKET: the run bucket the job-ticket
          # endpoint signs URLs for (terraform output run_bucket_name, #170);
          # repo variable, falling back to the Terraform default name.
          environment-variables: |
            TWAIN_RUN_BUCKET=${{ vars.TWAIN_RUN_BUCKET || 'twain-run-data-730335203321' }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
