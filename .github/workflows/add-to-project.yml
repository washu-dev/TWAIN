name: Add issues to project board

# Adds every newly opened issue on this repo to a GitHub Project (Projects V2)
# board. Fires for issues opened in the GitHub UI, via the REST API, and by the
# TWAIN "Create New Issue" button — all of which emit the `issues: opened`
# event. (Issues created with a PAT trigger workflows; only the default
# GITHUB_TOKEN is exempt, so the button's fine-grained PAT works here.)
#
# One-time setup (Repo → Settings → Secrets and variables → Actions):
#   • Variable ADD_TO_PROJECT_URL — the project URL, e.g.
#       https://github.com/orgs/washu-dev/projects/<number>
#   • Secret   ADD_TO_PROJECT_PAT — a token that can write to the project:
#       classic PAT with `project` + `repo`, or a fine-grained PAT with
#       Organization → Projects: Read and write. The default GITHUB_TOKEN
#       cannot write to org Projects V2, so a PAT (or GitHub App) is required.

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add issue to project board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: ${{ vars.ADD_TO_PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          # Optional: restrict to issues carrying certain labels (comma-separated).
          # The TWAIN button applies "user-submitted"; uncomment to add only those.
          # labeled: user-submitted
          # label-operator: OR
