[workspace]
authors = ["Tim Yang <manchestim@hotmail.com>"]
channels = ["conda-forge"]
name = "TWAIN"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
test = "pytest tests/"

[dependencies]
python = "3.12.*"
jsonschema = "*"
pytest = "*"
python-dotenv = ">=1.2.2,<2"
requests = ">=2.34.2,<3"
pymatgen = ">=2026.5.4,<2027"

# Per-workstream features: branches add their own dependencies here as needed,
# e.g. [feature.sim.dependencies] ase/pymatgen for Benchmark,
# [feature.workflows.dependencies] quacc/jobflow for WorkflowManagers.

[environments]
default = []
